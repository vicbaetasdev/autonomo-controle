<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060B16">
  <meta name="description" content="Autônomo Controle: agenda, clientes, financeiro e metas em um único lugar. MVP da equipe DevOracles.">
  <title>Autônomo Controle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23060B16'/%3E%3Cpath d='M12 4l1.8 5.4L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.6z' fill='%2322D3EE'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage"><div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="mark" id="side-mark"></div>
        <div><div class="n1">Autônomo</div><div class="n2">Controle</div></div>
      </div>
      <div class="side-eyebrow">Menu</div>
      <nav id="sidenav" aria-label="Navegação principal"></nav>
      <button id="side-new">+ Novo serviço</button>
      <button class="pro-teaser" id="pro-teaser">
        <span class="pt-t">✦ IA Consultora</span>
        <span class="pt-s">Insights e recomendações pro seu negócio</span>
        <span class="pt-b">Em breve · Plano Pro</span>
      </button>
      <div class="side-db" id="db-status"></div>
      <div class="user-card">
        <div class="avatar" aria-hidden="true">M</div>
        <div><div class="un">Mariana Silva</div><div class="ur">Manicure · Plano Gratuito</div></div>
      </div>
    </aside>
    <main id="main">
      <div id="screens"></div>
    </main>
    <nav id="tabbar" aria-label="Navegação"></nav>
    <button id="fab" aria-label="Novo serviço"></button>
  </div></div>
  <div id="backdrop" hidden></div>
  <div id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" hidden></div>
  <div id="chart-tip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
